name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Pas d'etape de lint : aucun linter n'est installe dans le projet.
      # `npm run lint` faisait echouer ce job a chaque execution. A retablir
      # en meme temps qu'ESLint (ajout d'une devDependency + package-lock).
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    # Quatre classes @SpringBootTest exigent une vraie base : Flyway cree le
    # schema et les tests sont en ddl-auto=validate. Sans ce service, le
    # contexte Spring ne demarrait pas et le job echouait systematiquement.
    # Port et identifiants alignes sur backend/src/test/resources.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: djibtout_test
          POSTGRES_USER: djibtout_test
          POSTGRES_PASSWORD: djibtout_test
        ports:
          - "55432:5432"
        options: >-
          --health-cmd "pg_isready -U djibtout_test -d djibtout_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode verify

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: djibtout/backend:ci
      - uses: docker/build-push-action@v6
        with:
          # frontend/Dockerfile fait `COPY frontend/...` : il attend la racine
          # du depot comme contexte, pas le sous-repertoire. Le job echouait.
          context: .
          file: frontend/Dockerfile
          push: false
          tags: djibtout/frontend:ci
