# Frontend et API sur la meme origine : nginx sert le build statique et
# proxifie /api vers le backend. Aucun appel cross-origin, donc aucun preflight
# et aucune dependance a la configuration CORS.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server_tokens off;

    # Le HEALTHCHECK du Dockerfile et le `depends_on: service_healthy` de
    # docker-compose interrogeaient /health, qui n'existait nulle part : le
    # conteneur restait marque unhealthy en permanence.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8082;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $proxy_add_x_forwarded_for AJOUTE l'en-tete envoye par le client. Or
        # RateLimitFilter lit le premier element de la liste : un client pouvait
        # donc forger son IP et echapper a la limitation. On ecrase.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Imports CSV/XLSX et documents vendeur (10 Mo cote applicatif).
        client_max_body_size 30m;
        proxy_read_timeout 120s;
    }

    # Medias servis par le backend quand MEDIA_STORAGE=local. Sans effet en S3,
    # ou les URL pointent directement sur le bucket.
    location /uploads/ {
        proxy_pass http://backend:8082;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite empreinte les noms de fichiers : le cache long est sans risque.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Routage cote client : /orders/12, /seller/products... n'existent pas sur
    # le disque. Sans ce repli, tout rechargement de page renvoyait un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
