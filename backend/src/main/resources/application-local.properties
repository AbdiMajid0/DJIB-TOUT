spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/djibtout}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
# Aligne sur test, staging et production. Avec `update`, Hibernate batissait
# ici le schema qui lui convenait : la base locale ne ressemblait a aucune
# autre. C'est ce qui a masque le defaut @Lob/bytea de SellerDocument, qui
# demarrait parfaitement en local et bloquait partout ailleurs.
# Flyway est desormais la seule source du schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.flyway.enabled=true
jwt.secret=${JWT_SECRET:djibtout-local-only-development-secret-change-before-production-2026}
app.admin-bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.payments.simulated=true
app.media.storage=local
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:3000,http://127.0.0.1:3000}
