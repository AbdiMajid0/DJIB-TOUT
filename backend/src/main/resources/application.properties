spring.application.name=djibtout-backend
spring.profiles.default=local
server.port=${SERVER_PORT:8082}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:3000,http://127.0.0.1:3000}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Exposait les proprietes d'environnement via /actuator/info.
management.info.env.enabled=false
info.app.name=DjibTout Backend
info.app.environment=${SPRING_PROFILES_ACTIVE:local}
# Faux par defaut : sans passerelle publiee, /api/payments/process repond 503
# et le rechargement DjibPay est refuse. Active en local et en test seulement.
app.payments.simulated=${PAYMENTS_SIMULATED:false}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@djibtout.com}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:disabled-google-client}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:disabled-google-secret}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:disabled-facebook-client}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:disabled-facebook-secret}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email
jwt.secret=${JWT_SECRET}
jwt.access-token-ms=${JWT_ACCESS_TOKEN_MS:900000}
jwt.refresh-token-ms=${JWT_REFRESH_TOKEN_MS:2592000000}
