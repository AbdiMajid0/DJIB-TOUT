spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=framework
app.admin-bootstrap.enabled=false
# Sans valeur par defaut : hors de ce fichier, la propriete retombait sur les
# origines localhost de application.properties. L'API demarrait, puis chaque
# appel du vrai frontend etait rejete par le navigateur — panne invisible
# cote serveur. Placeholder non resolu = echec au demarrage, ce qui se voit.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.media.storage=${MEDIA_STORAGE:s3}
app.media.s3.endpoint=${S3_ENDPOINT:}
app.media.s3.region=${S3_REGION}
app.media.s3.bucket=${S3_BUCKET}
app.media.s3.public-base-url=${S3_PUBLIC_BASE_URL}
app.media.s3.access-key=${S3_ACCESS_KEY}
app.media.s3.secret-key=${S3_SECRET_KEY}
