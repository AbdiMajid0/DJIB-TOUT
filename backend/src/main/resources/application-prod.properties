spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=framework
app.admin-bootstrap.enabled=false
app.media.storage=${MEDIA_STORAGE:s3}
app.media.s3.endpoint=${S3_ENDPOINT:}
app.media.s3.region=${S3_REGION}
app.media.s3.bucket=${S3_BUCKET}
app.media.s3.public-base-url=${S3_PUBLIC_BASE_URL}
app.media.s3.access-key=${S3_ACCESS_KEY}
app.media.s3.secret-key=${S3_SECRET_KEY}
